name: Sync upstream ReaWebAPI
run-name: Mirror ReaWebAPI ${{ inputs.tag || 'latest' }}

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag, or latest
        default: latest
        type: string
      publish_only:
        description: Publish the tag after the release preflight has synchronized main
        default: false
        type: boolean
  push:
    branches: [psyreasfx]
    paths: ['.github/psysia/**', '.github/workflows/sync-upstream.yml']

permissions:
  contents: write

concurrency:
  group: psysia-upstream-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Psysia/ReaWebAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psyreasfx
          fetch-depth: 0
      - name: Check mirror integrity rules
        run: python .github/psysia/test_sync_upstream.py
      - name: Sync source and mirror release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.tag || 'latest' }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          args=(--tag "$UPSTREAM_TAG" --defer-workflow-permission)
          if [[ "$PUBLISH_ONLY" == "true" ]]; then args+=(--skip-source-sync); fi
          python .github/psysia/sync_upstream.py "${args[@]}"
