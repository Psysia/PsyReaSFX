name: Code quality

on:
  pull_request:
  push:
    branches: [main, beta/0.9.x]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify ReaPack version menu policy
        shell: pwsh
        run: ./tools/Test-ReaPackVersionPolicy.ps1

      - name: Verify generated WebView translations
        run: python tools/generate_web_translations.py --check

      - name: Verify upstream synchronization rules
        shell: pwsh
        run: |
          python tools/reawebapi-fork/test_sync_upstream.py
          if ($LASTEXITCODE -ne 0) { throw 'Upstream mirror integrity test failed.' }
          ./tools/Test-ReaWebAPISync.ps1

      - name: Set up pinned Lua test runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/DevelopersCommunity/cmake-lua/releases/download/v5.4.6/Lua-5.4.6-win64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'Lua-5.4.6-win64.msi'
          $target = Join-Path $env:RUNNER_TEMP 'Lua-5.4.6'
          Invoke-WebRequest -Uri $url -OutFile $msi -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '1087abb5aca89cad29283a17745ac2819aa46ca076084e8b3416db87d2694ed8'
          if ($actual -cne $expected) { throw "Lua runtime hash mismatch: $actual" }
          $process = Start-Process msiexec.exe -ArgumentList '/a', $msi, '/qn', "TARGETDIR=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Lua runtime extraction failed: $($process.ExitCode)" }
          (Join-Path $target 'Lua/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify hidden neural process launch
        shell: pwsh
        run: ./tools/Test-NeuralHiddenLauncher.ps1

      - name: Parse Lua 5.3 source
        shell: pwsh
        run: |
          npm install --no-save --ignore-scripts luaparse@0.3.1
          node -e "const fs=require('fs'),lua=require('luaparse'); lua.parse(fs.readFileSync('PsyReaSFX_v0_7_23_Stable.lua','utf8'),{luaVersion:'5.3'}); console.log('Lua parse OK');"

      - name: Check Lua module scopes
        shell: pwsh
        run: |
          node tools/check_lua_module_scopes.cjs

      - name: Verify modular Lua release
        shell: pwsh
        run: |
          $built = Join-Path $env:RUNNER_TEMP 'PsyReaSFX.lua'
          ./tools/Build-LuaRelease.ps1 -Version 0.9.2-beta4 -OutputPath $built
          $tracked = [IO.File]::ReadAllText('PsyReaSFX_v0_7_23_Stable.lua').Replace("`r`n", "`n").Replace("`r", "`n")
          $generated = [IO.File]::ReadAllText($built).Replace("`r`n", "`n").Replace("`r", "`n")
          if ($tracked -cne $generated) {
            throw 'Tracked ReaPack script is stale. Rebuild it from src/lua before committing.'
          }
          node -e "const fs=require('fs'),lua=require('luaparse'); lua.parse(fs.readFileSync(process.argv[1],'utf8'),{luaVersion:'5.3'}); console.log('Generated Lua parse OK');" $built
          # Compiling with the real Lua 5.4 catches limits luaparse cannot see,
          # such as more than 200 active locals in the main chunk.
          luac -p $built
          if ($LASTEXITCODE -ne 0) { throw 'Generated Lua script does not compile.' }

      - name: Verify WebView entry and headless backend
        shell: pwsh
        run: |
          node tools/check_lua_module_scopes.cjs --webview
          node --check src/web/app.js
          node --check src/web/settings.js
          node --check src/web/icons.js
          node --check src/web/host.js
          $webBuild = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-WebView'
          ./tools/Build-WebRelease.ps1 -OutputPath $webBuild
          ./tools/Test-ReaPackWebView.ps1 -PackagePath $webBuild
          $webTracked = [IO.File]::ReadAllText('PsyReaSFX_WebView.lua').Replace("`r`n", "`n")
          $webGenerated = [IO.File]::ReadAllText((Join-Path $webBuild 'PsyReaSFX.lua')).Replace("`r`n", "`n")
          if ($webTracked -cne $webGenerated) { throw 'Tracked WebView beta entry is stale.' }
          $webVersion = (Get-Content 'src/web/app.json' -Raw | ConvertFrom-Json).version
          ./tools/Test-WebViewPackage.ps1 -PackagePath $webBuild -FixtureDirectory (Join-Path $env:RUNNER_TEMP 'PsyReaSFX-WebView-package-test') -ArchivePath (Join-Path $env:RUNNER_TEMP "PsyReaSFX_WebView_${webVersion}_win_x64.zip")
          ./tools/Test-ReaWebAPICandidate.ps1
          luac -p (Join-Path $webBuild 'PsyReaSFX.lua')
          if ($LASTEXITCODE -ne 0) { throw 'WebView entry does not compile.' }
          $webFixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-WebView-fixture'
          New-Item -ItemType Directory -Path $webFixture | Out-Null
          lua tools/lua_webview_selftest.lua (Join-Path $webBuild 'PsyReaSFX.lua') $webFixture
          if ($LASTEXITCODE -ne 0) { throw 'WebView backend regression failed.' }

      - name: Verify WebView layout and interactions
        shell: pwsh
        run: |
          $webTestTools = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-WebView-tools'
          npm install --prefix $webTestTools --no-save --ignore-scripts playwright@1.56.1 eslint@9.39.1 globals@16.5.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser test tooling installation failed.' }
          node tools/check_webview_code.cjs (Join-Path $webTestTools 'node_modules')
          if ($LASTEXITCODE -ne 0) { throw 'WebView entry or source parity check failed.' }
          node tools/webview_ui_selftest.cjs (Join-Path $webTestTools 'node_modules/playwright') (Join-Path $env:RUNNER_TEMP 'PsyReaSFX-WebView/web')
          if ($LASTEXITCODE -ne 0) { throw 'WebView layout regression failed.' }

      - name: Run Lua persistence fault injection
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-Lua-persistence'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $fixture 'backup') | Out-Null
          $lockedTarget = Join-Path $fixture 'externally-locked-target.bin'
          $lockedSource = Join-Path $fixture 'externally-locked-source.bin'
          [IO.File]::WriteAllText($lockedTarget, 'locked-old-generation')
          [IO.File]::WriteAllText($lockedSource, 'locked-new-generation')
          $lock = [IO.File]::Open($lockedTarget, 'Open', 'Read', 'Read')
          try {
            lua tools/lua_persistence_selftest.lua $fixture (Resolve-Path 'src/lua/20_jobs_storage.lua') $lockedTarget $lockedSource
            if ($LASTEXITCODE -ne 0) { throw "Lua persistence test failed: $LASTEXITCODE" }
          }
          finally {
            $lock.Dispose()
          }

      - name: Run official UCS catalog self-test
        shell: pwsh
        run: |
          lua tools/lua_ucs_catalog_selftest.lua (Resolve-Path 'assets/ucs/ucs-8.2.1.tsv') (Resolve-Path 'src/lua/25_ucs_catalog.lua') 500000 500000

      - name: Run Lua full-file duplicate comparison
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-Lua-duplicate-compare'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          lua tools/lua_duplicate_compare_selftest.lua $fixture (Resolve-Path 'src/lua/45_duplicate_confirmation.lua')

      - name: Run Lua incremental result rebuild
        shell: pwsh
        run: |
          lua tools/lua_incremental_results_selftest.lua (Resolve-Path 'src/lua/35_incremental_results.lua') 25000

      - name: Run Lua asset journal codec
        shell: pwsh
        run: |
          lua tools/lua_asset_journal_selftest.lua (Resolve-Path 'src/lua/36_asset_journal.lua')

      - name: Run Lua catalog cache capacity smoke test
        shell: pwsh
        run: |
          lua tools/lua_catalog_caches_selftest.lua (Resolve-Path 'src/lua/37_catalog_caches.lua') 500000

      - name: Run Lua incremental persistence capacity smoke test
        shell: pwsh
        run: |
          lua tools/lua_incremental_persistence_selftest.lua (Resolve-Path 'src/lua/38_incremental_persistence.lua') 25000

      - name: Run Lua host adapter self-test
        shell: pwsh
        run: |
          lua tools/lua_host_adapter_selftest.lua (Resolve-Path 'src/lua/15_host_adapter.lua')

      - name: Run Lua state store self-test
        shell: pwsh
        run: |
          lua tools/lua_state_store_selftest.lua (Resolve-Path 'src/lua/12_state_store.lua')

      - name: Run Lua i18n self-test
        shell: pwsh
        run: |
          lua tools/lua_i18n_selftest.lua (Resolve-Path 'src/lua/10_ui_core.lua')

      - name: Run Lua UI structure self-test
        shell: pwsh
        run: |
          lua tools/lua_ui_structure_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua')

      - name: Run workspace font and folder navigation self-test
        shell: pwsh
        run: |
          lua tools/lua_workspace_selftest.lua

      - name: Run workspace tabs self-test
        shell: pwsh
        run: |
          lua tools/lua_workspace_tabs_selftest.lua

      - name: Run workspace snapshot refresh self-test
        shell: pwsh
        run: |
          lua tools/lua_workspace_refresh_selftest.lua
          if ($LASTEXITCODE -ne 0) { throw 'Workspace snapshot refresh test failed' }

      - name: Run browser actions and neural progress self-test
        shell: pwsh
        run: |
          lua tools/lua_browser_actions_selftest.lua
          if ($LASTEXITCODE -ne 0) { throw 'Browser actions test failed' }

      - name: Run publisher product-folder navigation self-test
        shell: pwsh
        run: |
          lua tools/lua_product_navigation_selftest.lua
          if ($LASTEXITCODE -ne 0) { throw 'Product navigation test failed' }

      - name: Run Lua startup fast-path self-test
        shell: pwsh
        run: |
          lua tools/lua_startup_selftest.lua (Resolve-Path 'src/lua/10_ui_core.lua') (Resolve-Path 'src/lua/30_catalog.lua') (Resolve-Path 'src/lua/50_runtime_ui.lua')

      - name: Run incremental startup and import recovery tests
        shell: pwsh
        run: |
          lua tools/lua_startup_capacity_selftest.lua src/lua/10_ui_core.lua src/lua/30_catalog.lua src/lua/50_runtime_ui.lua src/lua/36_asset_journal.lua
          if ($LASTEXITCODE -ne 0) { throw 'Incremental startup test failed' }
          lua tools/lua_import_recovery_selftest.lua src/lua/50_runtime_ui.lua
          if ($LASTEXITCODE -ne 0) { throw 'Import recovery test failed' }

      - name: Run Lua waveform retry self-test
        shell: pwsh
        run: |
          lua tools/lua_waveform_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua')

      - name: Run Lua preview seek self-test
        shell: pwsh
        run: |
          lua tools/lua_preview_seek_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua')

      - name: Run Lua spectral cache self-test
        shell: pwsh
        run: |
          lua tools/lua_spectral_cache_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua')

      - name: Run Lua audio-content similarity self-test
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-similarity-cache'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          lua tools/lua_similarity_selftest.lua (Resolve-Path 'src/lua/42_similarity.lua') 500000 $fixture

      - name: Run Lua neural similarity protocol self-test
        shell: pwsh
        run: |
          lua tools/lua_neural_similarity_selftest.lua (Resolve-Path 'src/lua/43_neural_similarity.lua')

      - name: Run Lua AI semantic search self-test
        shell: pwsh
        run: |
          lua tools/lua_ai_semantic_selftest.lua (Resolve-Path 'src/lua/43_neural_similarity.lua') (Resolve-Path 'src/lua/44_ai_semantic_search.lua') (Resolve-Path 'src/lua/20_jobs_storage.lua')

      - name: Run Lua AI presets self-test
        shell: pwsh
        run: |
          lua tools/lua_ai_presets_selftest.lua
          if ($LASTEXITCODE -ne 0) { throw 'AI presets self-test failed' }

      - name: Run AI semantic bridge self-test
        shell: pwsh
        run: |
          ./tools/Test-AISemanticBridge.ps1

      - name: Run Lua Enter shortcut self-test
        shell: pwsh
        run: |
          lua tools/lua_enter_shortcut_selftest.lua (Resolve-Path 'src/lua/00_bootstrap.lua') (Resolve-Path 'src/lua/30_catalog.lua') (Resolve-Path 'src/lua/50_runtime_ui.lua')

      - name: Run Lua directory classification self-test
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-directory-classification'
          $directory = Join-Path $fixture 'folder'
          $file = Join-Path $fixture 'sample.wav'
          $missing = Join-Path $fixture 'missing'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          New-Item -ItemType File -Path $file -Force | Out-Null
          lua tools/lua_directory_selftest.lua (Resolve-Path 'src/lua/10_ui_core.lua') $directory $file $missing

      - name: Run Lua job coordinator self-test
        shell: pwsh
        run: |
          lua tools/lua_jobs_selftest.lua (Resolve-Path 'src/lua/20_jobs_storage.lua')

      - name: Run Lua search, hashing, relink and interaction-cache self-tests
        shell: pwsh
        run: |
          lua tools/lua_search_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua') (Resolve-Path 'src/lua/10_ui_core.lua') (Resolve-Path 'src/lua/30_catalog.lua')
          if ($LASTEXITCODE -ne 0) { throw 'Search predicate test failed' }
          lua tools/lua_hash_selftest.lua (Resolve-Path 'src/lua/10_ui_core.lua') (Resolve-Path 'src/lua/50_runtime_ui.lua')
          if ($LASTEXITCODE -ne 0) { throw 'Hash and TSV test failed' }
          lua tools/lua_relink_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua')
          if ($LASTEXITCODE -ne 0) { throw 'Relink migration test failed' }
          lua tools/lua_interaction_cache_selftest.lua (Resolve-Path 'src/lua/50_runtime_ui.lua') (Resolve-Path 'src/lua/10_ui_core.lua') (Resolve-Path 'src/lua/30_catalog.lua')
          if ($LASTEXITCODE -ne 0) { throw 'Interaction cache test failed' }

      - name: Audit Lua architecture boundaries
        run: python tools/audit_lua_architecture.py

      - name: Build Desktop Release
        run: dotnet build desktop/PsyReaSFX.Desktop/PsyReaSFX.Desktop.csproj -c Release

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          foreach ($project in @(
            'desktop/PsyReaSFX.Desktop/PsyReaSFX.Desktop.csproj',
            'neural/PsyReaSFX.NeuralSidecar/PsyReaSFX.NeuralSidecar.csproj'
          )) {
            $output = dotnet list $project package --vulnerable --include-transitive
            $output
            if ($output -match 'has the following vulnerable packages') {
              throw "NuGet vulnerability audit found a vulnerable dependency in $project."
            }
          }

      - name: Build neural similarity sidecar
        run: dotnet build neural/PsyReaSFX.NeuralSidecar/PsyReaSFX.NeuralSidecar.csproj -c Release

      - name: Run neural model golden self-test
        run: dotnet run --project neural/PsyReaSFX.NeuralSidecar/PsyReaSFX.NeuralSidecar.csproj -c Release --no-build -- self-test assets/neural/mn04_as_scene_320_v1

      - name: Run neural audio decode and resampling test
        shell: pwsh
        run: |
          ./tools/Test-NeuralAudioFormats.ps1 `
            -SidecarPath 'neural/PsyReaSFX.NeuralSidecar/bin/Release/net8.0/PsyReaSFX.NeuralSidecar.dll' `
            -ModelDirectory 'assets/neural/mn04_as_scene_320_v1' `
            -FixtureDirectory (Join-Path $env:RUNNER_TEMP 'PsyReaSFX-neural-formats')

      - name: Run neural job protocol smoke test
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-neural-jobs'
          ./tools/Test-NeuralJobs.ps1 `
            -SidecarPath 'neural/PsyReaSFX.NeuralSidecar/bin/Release/net8.0/PsyReaSFX.NeuralSidecar.dll' `
            -ModelDirectory 'assets/neural/mn04_as_scene_320_v1' `
            -FixtureDirectory $fixture

      - name: Build and verify release packages
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-release-assets'
          ./tools/Build-Release.ps1 -Version 0.9.2-beta4 -OutputDirectory $output
          ./tools/Test-ReleaseProvenance.ps1 -ArchivePath (Join-Path $output 'PsyReaSFX_v0_9_2_beta4.zip')
          ./tools/Test-ReleaseProvenance.ps1 -ArchivePath (Join-Path $output 'PsyReaSFX_Neural_Similarity_v0_9_2_beta4_win_x64.zip')
          ./tools/Test-NeuralPackage.ps1 `
            -ArchivePath (Join-Path $output 'PsyReaSFX_Neural_Similarity_v0_9_2_beta4_win_x64.zip') `
            -FixtureDirectory (Join-Path $env:RUNNER_TEMP 'PsyReaSFX-neural-package')
          ./tools/Test-ReaPackNeuralPackage.ps1 `
            -IndexPath 'index.xml' `
            -Version '0.9.0' `
            -SidecarPath (Join-Path $output 'PsyReaSFX.NeuralSidecar_v0_9_2_beta4_win_x64.exe')

      - name: Run Desktop self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-Desktop-self-test.json'
          $exe = 'desktop/PsyReaSFX.Desktop/bin/Release/net8.0-windows/PsyReaSFX.Desktop.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test', $report -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw "Desktop self-test failed with exit code $($process.ExitCode)."
          }
          Get-Content -LiteralPath $report

      - name: Run disposable catalog benchmark
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-hardening-1k'
          $report = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-hardening-benchmark.json'
          python tools/generate_hardening_library.py $fixture --count 1000
          $exe = 'desktop/PsyReaSFX.Desktop/bin/Release/net8.0-windows/PsyReaSFX.Desktop.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--hardening-benchmark', $fixture, $report -Wait -PassThru -WindowStyle Hidden
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) {
            throw "Hardening benchmark failed with exit code $($process.ExitCode)."
          }

      - name: Run synthetic capacity smoke test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'PsyReaSFX-capacity-benchmark.json'
          $exe = 'desktop/PsyReaSFX.Desktop/bin/Release/net8.0-windows/PsyReaSFX.Desktop.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--hardening-capacity-benchmark', '25000', $report -Wait -PassThru -WindowStyle Hidden
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) {
            throw "Capacity benchmark failed with exit code $($process.ExitCode)."
          }
