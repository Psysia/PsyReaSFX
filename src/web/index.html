<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>PsyReaSFX 0.9.a</title>
    <link rel="icon" href="../assets/brand/psyreasfx-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <nav id="main-menu" aria-label="应用菜单">
          <button data-menu="file">文件</button
          ><button data-menu="library">音效库</button>
          <button data-menu="edit">编辑</button
          ><button data-menu="view">视图</button>
          <button data-menu="transfer">Transfer</button
          ><button data-menu="help">帮助</button>
          <span class="workspace-spacer"></span
          ><span class="menu-hint">声音工作区</span>
        </nav>
        <div class="topbar">
          <div class="brand">
            <svg viewBox="0 0 26 26" aria-hidden="true">
              <path d="M3 11v4m4-8v12m4-16v20m4-17v14m4-11v8m4-5v2" /></svg
            ><strong>PsyReaSFX</strong><small id="app-version">0.9.a</small>
          </div>
          <label class="scope-control"
            ><span class="sr-only">搜索范围</span
            ><select id="scope">
              <option value="">全部音效库</option>
            </select></label
          >
          <form id="search-form" class="search">
            <span aria-hidden="true">⌕</span
            ><input
              id="search"
              type="search"
              placeholder="搜索文件名、描述、关键词…"
              autocomplete="off"
              aria-label="搜索声音"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="search-suggestions"
            /><button id="ai-search" type="button" title="AI 语义搜索">
              AI
            </button>
          </form>
          <button
            id="collection-menu"
            class="bin-button"
            title="将选择加入集合"
          >
            ▱ <span>素材箱</span>
            <span id="selection-count" class="count">0</span>⌄
          </button>
          <button
            id="layout-menu"
            title="布局、主题与显示列"
            aria-label="布局设置"
          >
            ▦
          </button>
          <button id="settings-open" title="设置与维护" aria-label="设置与维护">
            ⚙
          </button>
        </div>
        <div class="workspace-bar">
          <button
            id="left-toggle"
            title="展开或收起来源侧栏"
            aria-label="切换来源侧栏"
          >
            ☰
          </button>
          <nav id="tabs" aria-label="浏览标签页"></nav>
          <button id="new-tab" title="新建标签页" aria-label="新建标签页">
            ＋</button
          ><span class="workspace-spacer"></span
          ><span
            id="performance-stats"
            hidden
            title="后台 / 宿主更新 / 帧间隔"
          ></span
          ><span id="host-label">正在连接…</span
          ><button
            id="right-toggle"
            title="展开或收起检查器"
            aria-label="切换检查器"
          >
            ▥
          </button>
        </div>
      </header>
      <main id="browser">
        <nav id="navigation-rail" aria-label="快捷导航">
          <button
            data-rail="libraries"
            title="音效库与来源"
            aria-label="音效库与来源"
          >
            ▱
          </button>
          <button data-rail="all" title="浏览与筛选" aria-label="浏览与筛选">
            ≡
          </button>
          <button data-rail="favorites" title="收藏" aria-label="收藏">
            ☆
          </button>
          <button data-rail="previewed" title="试听历史" aria-label="试听历史">
            ◷
          </button>
          <button data-rail="ucs" title="UCS 分类" aria-label="UCS 分类">
            ◇
          </button>
          <button data-rail="collections" title="集合" aria-label="集合">
            ▧
          </button>
        </nav>
        <aside id="sources" aria-label="来源与集合">
          <div class="source-heading">
            <strong id="source-title">音效库与文件夹</strong>
          </div>
          <section data-source-panel="all favorites previewed">
            <div id="views"></div>
          </section>
          <section data-source-panel="libraries">
            <div class="section-label">
              音效库
              <button
                id="add-library"
                title="添加音效库"
                aria-label="添加音效库"
              >
                ＋
              </button>
            </div>
            <div id="libraries"></div>
          </section>
          <section data-source-panel="ucs">
            <details id="ucs-directory">
              <summary class="section-label">UCS 分类</summary>
              <div class="ucs-search-row">
                <input
                  id="ucs-search"
                  type="search"
                  placeholder="搜索分类、CatID、中英文…"
                  aria-label="搜索 UCS 分类"
                />
                <button
                  id="ucs-search-clear"
                  title="清除 UCS 搜索"
                  aria-label="清除 UCS 搜索"
                  hidden
                >
                  ×
                </button>
              </div>
              <p id="ucs-search-status" class="muted" role="status" hidden></p>
              <div id="ucs-categories"></div>
            </details>
          </section>
          <section data-source-panel="collections">
            <div class="section-label">
              集合
              <button
                id="new-collection"
                title="新建集合"
                aria-label="新建集合"
              >
                ＋
              </button>
            </div>
            <div id="collections"></div>
          </section>
          <section data-source-panel="all favorites">
            <details>
              <summary class="section-label">保存的搜索</summary>
              <div id="saved-searches"></div>
            </details>
          </section>
          <section data-source-panel="all">
            <details>
              <summary class="section-label">工作流筛选</summary>
              <div id="workflow-filters"></div>
            </details>
          </section>
        </aside>
        <div
          class="vertical-splitter"
          data-resize="left"
          role="separator"
          aria-label="调整来源侧栏宽度"
          aria-orientation="vertical"
          tabindex="0"
        ></div>
        <section id="results" aria-label="声音列表">
          <div class="results-toolbar">
            <span id="result-count">正在读取素材库…</span
            ><span id="scope-label"></span><span class="workspace-spacer"></span
            ><select id="sort" aria-label="排序">
              <option value="name">名称</option>
              <option value="duration">时长</option>
              <option value="library">音效库</option>
              <option value="used">最近插入</option>
              <option value="previewed">最近试听</option>
              <option value="similarity">相似度</option>
              <option value="ai_order">AI 相关性</option></select
            ><button
              id="sort-direction"
              title="切换升降序"
              aria-label="切换排序方向"
            >
              ↑</button
            ><button id="columns-open" title="显示列" aria-label="显示列">
              ☷
            </button>
          </div>
          <div id="filter-bar" hidden aria-label="当前筛选条件"></div>
          <div id="column-head" class="column-head" role="row"></div>
          <div
            id="result-scroll"
            role="grid"
            aria-label="声音检索结果"
            tabindex="0"
          >
            <div id="result-space"></div>
            <div id="visible-rows"></div>
          </div>
          <div id="empty-state" hidden>
            <h2>建立你的声音工作区</h2>
            <p>添加来源文件夹，开始浏览、试听与整理。</p>
            <button id="empty-add">添加音效库</button>
          </div>
          <div id="no-results" hidden>
            <strong>没有匹配的声音</strong>
            <p>试试其他关键词，或清除筛选条件。</p>
            <button id="clear-query">清除搜索与筛选</button>
          </div>
          <div id="startup-state" hidden role="status">
            <span class="loading-ring"></span><strong>正在打开声音工作区</strong
            ><span id="startup-phase"></span><span id="startup-count"></span>
          </div>
          <button id="ai-more" hidden>加载下一批 AI 结果</button>
        </section>
        <div
          class="vertical-splitter"
          data-resize="right"
          role="separator"
          aria-label="调整检查器宽度"
          aria-orientation="vertical"
          tabindex="0"
        ></div>
        <aside id="inspector" aria-label="检查器">
          <nav class="inspector-tabs">
            <button data-inspector="metadata" class="active">元数据</button
            ><button data-inspector="regions">Region</button
            ><button data-inspector="transfer">交付</button>
          </nav>
          <div id="inspector-body"></div>
        </aside>
      </main>
      <div
        id="audition-splitter"
        role="separator"
        aria-label="调整试听区域高度"
        aria-orientation="horizontal"
        tabindex="0"
      ></div>
      <section id="audition" aria-label="详细波形与试听">
        <div class="audition-heading">
          <strong id="asset-name">选择一个声音</strong
          ><span id="asset-info"></span><span class="workspace-spacer"></span
          ><button id="similar-search" title="查找相似声音">相似声音</button
          ><button id="save-region" title="保存当前波形选区为 Region">
            ＋ Region</button
          ><button
            id="audition-more"
            title="更多试听操作"
            aria-label="更多试听操作"
          >
            •••</button
          ><span id="range-label"></span>
        </div>
        <div id="analysis-bar" hidden role="status">
          <span id="analysis-label"></span
          ><progress id="analysis-progress"></progress>
          <span id="analysis-count"></span
          ><button id="analysis-cancel">取消分析</button>
        </div>
        <details id="fx-panel">
          <summary>FX <span>变调 · 变速 · 增益</span></summary>
          <div class="fx-controls">
            <label
              >Pitch
              <input
                id="fx-pitch"
                type="range"
                min="-24"
                max="24"
                step="0.1"
                value="0"
              /><input
                id="fx-pitch-value"
                type="number"
                min="-24"
                max="24"
                step="0.1"
                value="0"
              />st</label
            ><label
              >Rate
              <input
                id="fx-rate"
                type="range"
                min="0.25"
                max="4"
                step="0.01"
                value="1"
              /><input
                id="fx-rate-value"
                type="number"
                min="0.25"
                max="4"
                step="0.01"
                value="1"
              />×</label
            ><label
              >Gain
              <input
                id="fx-gain"
                type="range"
                min="-36"
                max="18"
                step="0.1"
                value="0"
              /><input
                id="fx-gain-value"
                type="number"
                min="-36"
                max="18"
                step="0.1"
                value="0"
              />dB</label
            ><label
              ><input
                id="preserve-pitch"
                type="checkbox"
                checked
              />保持音高</label
            ><label><input id="reverse" type="checkbox" />反向</label
            ><button id="fx-presets">预设</button
            ><button id="fx-reset">复位</button>
          </div>
        </details>
        <div id="wave-area">
          <div id="wave-readouts">
            <label>当前位置 <output id="current-time">00:00.000</output></label
            ><label>入点 <output id="in-time">00:00.000</output></label
            ><label>出点 <output id="out-time">00:00.000</output></label
            ><label>选区时长 <output id="range-time">00:00.000</output></label>
          </div>
          <div id="detail-wave-wrap">
            <canvas
              id="detail-wave"
              aria-label="详细波形，拖动选择区间，双击试听，滚轮缩放"
              tabindex="0"
            ></canvas
            ><span id="detail-playhead" hidden></span
            ><span id="wave-status">等待选择素材</span>
            <button id="wave-retry" hidden>重试波形</button>
          </div>
        </div>
        <div id="loudness-strip" aria-label="响度读数" hidden></div>
        <div class="transport">
          <button id="stop" title="停止" aria-label="停止">■</button
          ><button
            id="play"
            class="play-button"
            title="播放 / 空格"
            aria-label="播放"
          >
            ▶</button
          ><button
            id="loop"
            title="循环"
            aria-label="循环"
            aria-pressed="false"
          >
            ↻</button
          ><output id="transport-time">00:00.000 / 00:00.000</output
          ><label class="auto-preview"
            ><input
              id="auto-preview"
              type="checkbox"
              checked
            />选择即试听</label
          ><span class="workspace-spacer"></span
          ><button id="zoom-reset" title="复位缩放">适应</button
          ><button id="fx-toggle" aria-expanded="false">FX⌄</button
          ><button id="drag-selection" title="按住并拖到 REAPER 编排区">
            拖入选区</button
          ><button id="insert">↥ 插入 REAPER</button
          ><button id="transfer-open">⇥ Transfer</button>
        </div>
      </section>
      <footer>
        <span id="status" role="status">正在连接宿主…</span
        ><span class="workspace-spacer"></span
        ><button id="cancel-tasks" hidden>取消任务</button
        ><button id="tasks-open" title="查看任务详情">
          任务 <span id="tasks-label"></span>
        </button>
      </footer>
    </div>
    <div id="popover" popover="auto"></div>
    <div id="toast" hidden role="alert">
      <span id="toast-message"></span
      ><button id="toast-close" aria-label="关闭提示">×</button>
    </div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <header class="settings-header">
        <div>
          <small>PsyReaSFX</small>
          <h2 id="settings-title">设置与维护</h2>
        </div>
        <input
          id="settings-search"
          type="search"
          placeholder="搜索设置…"
          aria-label="搜索设置"
          autocomplete="off"
        />
        <button id="settings-close" type="button" aria-label="关闭设置">
          ×
        </button>
      </header>
      <div class="settings-layout">
        <nav
          id="settings-nav"
          role="tablist"
          aria-label="设置分类"
          aria-orientation="vertical"
        ></nav>
        <div id="settings-body" role="tabpanel"></div>
      </div>
      <footer class="settings-footer">
        <span id="dialog-status" role="status"></span
        ><span class="workspace-spacer"></span>
        <button id="settings-discard" type="button" hidden>放弃更改</button
        ><button id="settings-apply" type="button" class="primary" disabled>
          应用更改
        </button>
      </footer>
    </dialog>
    <dialog id="input-dialog" aria-labelledby="input-title">
      <form id="input-form">
        <h2 id="input-title"></h2>
        <p id="input-description" class="muted"></p>
        <label class="field"
          ><span>名称</span
          ><input id="input-value" required maxlength="128" autocomplete="off"
        /></label>
        <div class="action-row">
          <button id="input-cancel" type="button">取消</button
          ><button type="submit" class="primary">确定</button>
        </div>
      </form>
    </dialog>
    <div
      id="search-suggestions"
      popover="auto"
      role="listbox"
      aria-label="UCS 搜索提示"
    ></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
